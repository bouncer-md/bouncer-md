name: Resolver CI

on:
  push:
    paths:
      - "resolver/**"
      - ".github/workflows/resolver-ci.yml"
  pull_request:
    paths:
      - "resolver/**"
      - ".github/workflows/resolver-ci.yml"

jobs:
  lint-and-typecheck:
    name: Lint · Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: resolver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: resolver/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: resolver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: resolver/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
